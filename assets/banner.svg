<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="teal-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="badge-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Radial Glow Behind Title -->
    <radialGradient id="center-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(0.9) translate(-20px, 15px); opacity: 0.6; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseRing {
      0% { r: 12; opacity: 0.8; }
      100% { r: 28; opacity: 0; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 260px; }
    .flow-line { stroke-dasharray: 8, 8; animation: dashLine 25s linear infinite; }
    .pill-floating-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-floating-2 { animation: floatPillReverse 6s ease-in-out infinite; }
    .pill-floating-3 { animation: floatPill 5.5s ease-in-out infinite; }
    .radar-ring { animation: pulseRing 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Animated Glowing Ambience in Background -->
  <circle class="orb-1" cx="220" cy="110" r="140" fill="#4f46e5" filter="blur(50px)" />
  <circle class="orb-2" cx="980" cy="250" r="160" fill="#ec4899" filter="blur(60px)" />
  <circle cx="600" cy="180" r="280" fill="url(#center-radial)" />

  <!-- Grid Texture Overlay -->
  <rect width="1200" height="360" fill="url(#grid-pattern)" />

  <!-- Dynamic Connecting Network Nodes (Behind text layer) -->
  <g opacity="0.45">
    <path class="flow-line" d="M 80 180 C 260 90, 380 270, 600 180 C 820 90, 940 270, 1120 180" fill="none" stroke="url(#primary-glow)" stroke-width="2.5" />
    <circle cx="200" cy="140" r="4" fill="#a855f7" />
    <circle cx="600" cy="180" r="5" fill="#ec4899" />
    <circle cx="1000" cy="220" r="4" fill="#06b6d4" />
  </g>

  <!-- Subtle Animated Ambient Tech Pills in Background Layer -->
  <!-- Top Left Pill -->
  <g class="pill-floating-1" opacity="0.65">
    <rect x="70" y="45" width="165" height="36" rx="18" fill="url(#card-grad)" stroke="#4f46e5" stroke-width="1.2" />
    <circle cx="90" cy="63" r="5" fill="#22c55e" />
    <text x="105" y="68" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">⚡ Tasks &amp; Docs</text>
  </g>

  <!-- Top Right Pill -->
  <g class="pill-floating-2" opacity="0.65">
    <rect x="965" y="55" width="165" height="36" rx="18" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="985" cy="73" r="5" fill="#38bdf8" />
    <text x="1000" y="78" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">🚀 Work OS Hub</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="pill-floating-2" opacity="0.65">
    <rect x="90" y="275" width="180" height="36" rx="18" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="110" cy="293" r="5" fill="#06b6d4" />
    <text x="125" y="298" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">🔒 Self-Hosted IAM</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="pill-floating-3" opacity="0.65">
    <rect x="945" y="275" width="185" height="36" rx="18" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.2" />
    <circle cx="965" cy="293" r="5" fill="#ec4899" />
    <text x="980" y="298" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">📊 Database Views</text>
  </g>

  <!-- FOREGROUND: Crystal Clear Typography (Always on top, fully legible) -->
  <g id="foreground-content">
    <!-- Category Mini-Tag -->
    <rect x="465" y="62" width="270" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="600" y="81" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">★ CURATED ECOSYSTEM ★</text>

    <!-- Main Title with Gradient fill -->
    <text class="title-text" x="600" y="150" text-anchor="middle" font-size="44" fill="url(#primary-glow)" letter-spacing="-0.5">
      Unified Work Management
    </text>
    <text class="title-text" x="600" y="196" text-anchor="middle" font-size="36" fill="#f8fafc" letter-spacing="-0.5">
      &amp; Modern Workspace Hub
    </text>

    <!-- Subtitle Description -->
    <text class="sub-text" x="600" y="240" text-anchor="middle" font-size="16" fill="#94a3b8" letter-spacing="0.2">
      Consolidating Tasks, Collaborative Docs, Spreadsheets, Knowledge Bases &amp; Self-Hosted Hubs
    </text>

    <!-- Bottom Feature Badges List -->
    <g transform="translate(365, 275)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="18" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Enterprise SaaS</text>

      <rect x="145" y="0" width="160" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="225" y="18" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Open-Source Alternatives</text>

      <rect x="320" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="395" y="18" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Local-First &amp; CRDT</text>
    </g>
  </g>
</svg>
